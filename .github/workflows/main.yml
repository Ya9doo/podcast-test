name: Generate Podcast Feeds
on: [push]
jobs:
  build:
    runs-on: ubuntu_latest
    steps:
      - name: Checkout Repo
        uses: action/checkout@v3
      - name: Setup Python
        uses: action/setup-python@v4
        with:
          python_version: '3.10'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
      - name: Run Feed Generator
        run: python feed.py
      - name: Push Repo
        run: |
          git config user.name github_actions
          git config user.email githyb-actions@github.com
          git add .
          git commit -m "Modified Feed"
          git push
      
        
      
      
